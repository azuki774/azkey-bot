name: Build and publish container

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions: {}

env:
  IMAGE_NAME: ghcr.io/azuki774/azkey-bot-roumu

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.tag.outputs.publish }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "${files}" ]]; then
            printf 'Files not formatted:\n%s\n' "${files}"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Select publish tag
        id: tag
        shell: bash
        run: |
          set -Eeuo pipefail

          echo 'publish=false' >> "${GITHUB_OUTPUT}"
          echo 'image_tag=' >> "${GITHUB_OUTPUT}"

          # Match the v-prefixed release tags accepted by the old workflow.
          semver_regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)))*)?$'

          if [[ "${GITHUB_EVENT_NAME}" == 'push' && "${GITHUB_REF_TYPE}" == 'branch' && "${GITHUB_REF_NAME}" == 'master' ]]; then
            {
              echo 'publish=true'
              echo "image_tag=${GITHUB_SHA:0:7}"
            } >> "${GITHUB_OUTPUT}"
          elif [[ "${GITHUB_EVENT_NAME}" == 'push' && "${GITHUB_REF_TYPE}" == 'tag' && "${GITHUB_REF_NAME}" =~ ${semver_regex} ]]; then
            image_tag="${GITHUB_REF_NAME#v}"
            if (( ${#image_tag} <= 128 )); then
              {
                echo 'publish=true'
                echo "image_tag=${image_tag}"
              } >> "${GITHUB_OUTPUT}"
            else
              echo "Not publishing ${GITHUB_REF_NAME}: image tag exceeds 128 characters." >&2
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build container image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: azkey-bot-roumu:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test startup and graceful SIGTERM
        shell: bash
        run: |
          set -Eeuo pipefail

          rules_dir="${RUNNER_TEMP}/azkey-bot-rules"
          mkdir -p "${rules_dir}"
          cp configs/azkey-roumu-bot/rules.example.json "${rules_dir}/rules.json"

          container_name=azkey-bot-roumu-smoke
          cleanup() {
            docker rm -f "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "${container_name}" \
            --platform linux/amd64 \
            --stop-signal SIGTERM \
            --env MISSKEY_BASE_URL=https://misskey.example.invalid \
            --env MISSKEY_TOKEN=dummy-token \
            --env RULES_FILE=/config/rules.json \
            --volume "${rules_dir}/rules.json:/config/rules.json:ro" \
            azkey-bot-roumu:ci

          started=false
          for _ in {1..30}; do
            logs="$(docker logs "${container_name}" 2>&1 || true)"
            if grep -Fq 'azkey-roumu-bot started' <<<"${logs}"; then
              started=true
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "${container_name}")" != 'true' ]]; then
              printf '%s\n' "${logs}"
              exit 1
            fi
            sleep 1
          done
          if [[ "${started}" != 'true' ]]; then
            docker logs "${container_name}"
            exit 1
          fi

          docker stop --time 10 "${container_name}"
          if [[ "$(docker inspect --format '{{.State.ExitCode}}' "${container_name}")" != '0' ]]; then
            docker logs "${container_name}"
            exit 1
          fi
          final_logs="$(docker logs "${container_name}" 2>&1)"
          if ! grep -Fq 'azkey-roumu-bot stopped' <<<"${final_logs}"; then
            printf '%s\n' "${final_logs}"
            exit 1
          fi

  publish:
    if: github.event_name == 'push' && needs.verify.outputs.publish == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.verify.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
